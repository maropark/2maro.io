      <path d="M15 14 l.7 1.4 l1.4 .2 l-1 1 l.3 1.4 l-1.4 -.7 l-1.4 .7 l.3 -1.4 l-1 -1 l1.4 -.2 z" fill="#fff" opacity="0.8"></path>
      <circle cx="3" cy="15" r="0.6" fill="#fff" opacity="0.8"></circle>
      <circle cx="17" cy="4" r="0.6" fill="#fff" opacity="0.8"></circle>
    </pattern>

    
