      </g>
      <text x="11" y="14" font-family="serif" font-size="6" fill="#C1440E" text-anchor="middle">2¢</text>
      <text x="29" y="14" font-family="serif" font-size="6" fill="#C1440E" text-anchor="middle">★</text>
    </pattern>

    
