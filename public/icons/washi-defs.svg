        <ellipse cx="22" cy="9" rx="1.4" ry="1" transform="rotate(-20 22 9)"></ellipse>
        <line x1="23" y1="9" x2="23" y2="18" stroke="#2C2C2C" stroke-width="0.6"></line>
        <ellipse cx="32" cy="12" rx="1.4" ry="1" transform="rotate(-20 32 12)"></ellipse>
        <line x1="33" y1="12" x2="33" y2="3" stroke="#2C2C2C" stroke-width="0.6"></line>
      </g>
